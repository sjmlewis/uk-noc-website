name: Official updates and Offset news

# Every 15 minutes this reads GOV.UK's public search for Ministry of Defence
# publications on UK Offset (tools/gov_updates.py, saved in data/gov_updates.json)
# and refreshes the weekly Offset news (tools/news_feed.py, saved in
# data/news.json), then rebuilds the pages (tools/build_noc.py) and publishes
# them on the live site. It never deletes an update and never changes anything
# except those two data files, index.html, updates.html and news.html.
# Nothing to set up: GOV.UK needs no key.

on:
  schedule:
    # Every 15 minutes, so a new MOD publication appears here soon after it
    # appears on GOV.UK. GitHub sometimes skips a scheduled run; the next run
    # catches up. Each day's first run also records the date it checked, which
    # keeps this repository active so GitHub keeps the schedule switched on.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:         # adds a "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: gov-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect official updates from GOV.UK
        run: python3 tools/gov_updates.py

      - name: Refresh the weekly Offset news
        run: python3 tools/news_feed.py

      - name: Rebuild the pages
        run: python3 tools/build_noc.py

      - name: Check only the update files changed
        run: |
          git status --porcelain
          BAD=$(git status --porcelain | awk '{print $2}' | grep -vxE 'data/gov_updates.json|data/news.json|index.html|updates.html|news.html' || true)
          if [ -n "$BAD" ]; then echo "Stopping: unexpected files changed: $BAD"; exit 1; fi

      - name: Publish
        run: |
          if git diff --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "UK-NOC updates"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gov_updates.json data/news.json index.html updates.html news.html
          git commit -m "Official updates and Offset news (checked $(python3 -c "import json;print(json.load(open('data/gov_updates.json'))['checked'])"))"
          git pull --rebase origin main
          git push origin HEAD:main
